        </h1>
        <p class="tagline">YouTube, with the noise let out.</p>
      </header>

      <!-- Master switch -->
      <label class="row-power">
        <span>
          <span class="row-label">Tubeless is on</span>
          <span class="row-hint">Pause to view YouTube unmodified.</span>
        </span>
        <span class="toggle"><input type="checkbox" data-key="enabled" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
      </label>

      <!-- Sidebar -->
      <section class="section">
        <div class="section-header">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="4" y1="12" x2="14" y2="12"/>
            <line x1="4" y1="17" x2="20" y2="17"/>
          </svg>
          <h2 class="section-title">Sidebar</h2>
        </div>

        <label class="row">
          <span class="row-label">Hide Shorts</span>
          <span class="toggle"><input type="checkbox" data-key="sidenav.hideShorts" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row">
          <span class="row-label">Hide Explore (Trending, Music, Gaming&hellip;)</span>
          <span class="toggle"><input type="checkbox" data-key="sidenav.hideExplore" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row">
          <span class="row-label">Hide &ldquo;More from YouTube&rdquo;</span>
          <span class="toggle"><input type="checkbox" data-key="sidenav.hideMoreFromYouTube" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="select-row">
          <span class="row-label">&ldquo;You&rdquo; section</span>
          <select class="select" data-key="sidenav.youSection">
            <option value="full">Full</option>
            <option value="minimal">Minimal</option>
            <option value="hidden">Hidden</option>
          </select>
        </label>
      </section>

      <!-- Top bar -->
      <section class="section">
        <div class="section-header">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <h2 class="section-title">Top bar</h2>
        </div>
        <label class="row">
          <span class="row-label">Hide &ldquo;Create&rdquo; button</span>
          <span class="toggle"><input type="checkbox" data-key="topBar.hideCreate" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row">
          <span class="row-label">Hide notifications bell</span>
          <span class="toggle"><input type="checkbox" data-key="topBar.hideNotifications" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row">
          <span class="row-label">Hide filter chips</span>
          <span class="toggle"><input type="checkbox" data-key="topBar.hideFilterChips" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
      </section>

      <!-- Feeds -->
      <section class="section">
        <div class="section-header">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="5" rx="1"/>
            <rect x="3" y="11" width="18" height="5" rx="1"/>
            <rect x="3" y="18" width="10" height="3" rx="1"/>
          </svg>
          <h2 class="section-title">Feeds</h2>
        </div>

        <p class="section-hint">Applies to Home, Subscriptions and search results. Channel pages are never filtered.</p>

        <label class="row" data-master="homeShelves.hideAll">
          <span>
            <span class="row-label">Hide all shelves</span>
            <span class="row-hint">Every shelf strip, including unnamed ones like &ldquo;People also watched&rdquo;.</span>
          </span>
          <span class="toggle"><input type="checkbox" data-key="homeShelves.hideAll" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row" data-disabled-by="homeShelves.hideAll">
          <span class="row-label">Hide gaming shelves</span>
          <span class="toggle"><input type="checkbox" data-key="homeShelves.hideGaming" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row">
          <span class="row-label">Hide event banners</span>
          <span class="toggle"><input type="checkbox" data-key="homeShelves.hideEventBanners" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row">
          <span class="row-label">Hide alert &amp; promo banners</span>
          <span class="toggle"><input type="checkbox" data-key="homeShelves.hideAlertBanners" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row">
          <span class="row-label">Hide feed nudges</span>
          <span class="toggle"><input type="checkbox" data-key="homeShelves.hideFeedNudges" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row"><span class="row-label">Hide Shorts</span><span class="toggle"><input type="checkbox" data-key="contentTypes.hideShorts" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide movies &amp; shows</span><span class="toggle"><input type="checkbox" data-key="contentTypes.hideMovies" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide community posts</span><span class="toggle"><input type="checkbox" data-key="contentTypes.hidePosts" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide Mixes</span><span class="toggle"><input type="checkbox" data-key="contentTypes.hideMixes" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide playlists &amp; podcasts</span><span class="toggle"><input type="checkbox" data-key="contentTypes.hideCollections" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide live streams</span><span class="toggle"><input type="checkbox" data-key="contentTypes.hideLive" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide music videos</span><span class="toggle"><input type="checkbox" data-key="contentTypes.hideMusic" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row">
          <span>
            <span class="row-label">Hide member-only videos</span>
            <span class="row-hint">On channels you&rsquo;ve joined, this also hides member videos you can watch.</span>
          </span>
          <span class="toggle"><input type="checkbox" data-key="contentTypes.hideMembersOnly" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
        <label class="row"><span class="row-label">Hide Premieres &amp; upcoming</span><span class="toggle"><input type="checkbox" data-key="contentTypes.hidePremieres" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
      </section>

      <!-- Watch page -->
      <section class="section">
        <div class="section-header">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
            <polygon points="6 4 20 12 6 20 6 4"/>
          </svg>
          <h2 class="section-title">Watch page</h2>
        </div>
        <label class="select-row">
          <span class="row-label">Action buttons</span>
          <select class="select" data-key="watchPage.actionRow">
            <option value="full">Full</option>
            <option value="minimal">Minimal</option>
          </select>
        </label>
        <label class="row"><span class="row-label">Hide merch shelf</span><span class="toggle"><input type="checkbox" data-key="watchPage.hideMerch" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide live chat</span><span class="toggle"><input type="checkbox" data-key="watchPage.hideLiveChat" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide fundraiser shelf</span><span class="toggle"><input type="checkbox" data-key="watchPage.hideFundraiser" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide end-screen cards</span><span class="toggle"><input type="checkbox" data-key="watchPage.hideEndScreenCards" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide description</span><span class="toggle"><input type="checkbox" data-key="watchPage.hideDescription" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide comments</span><span class="toggle"><input type="checkbox" data-key="watchPage.hideComments" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide recommendations sidebar</span><span class="toggle"><input type="checkbox" data-key="watchPage.hideRecommendations" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
        <label class="row"><span class="row-label">Hide info panels (Wikipedia / context cards)</span><span class="toggle"><input type="checkbox" data-key="watchPage.hideInfoPanels" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span></label>
      </section>

      <!-- AI -->
      <section class="section">
        <div class="section-header">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/>
            <path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/>
          </svg>
          <h2 class="section-title">AI</h2>
        </div>
        <label class="row">
          <span>
            <span class="row-label">Hide AI features</span>
            <span class="row-hint">Video summaries (watch page &amp; search), &ldquo;Ask questions&rdquo;, Ask YouTube in the search bar, and custom feed prompts. The watch page Ask button follows Action buttons.</span>
          </span>
          <span class="toggle"><input type="checkbox" data-key="watchPage.hideAISummary" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
      </section>

      <!-- Ads -->
      <section class="section">
        <div class="section-header">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/>
            <path d="M15 8c1.5 1.2 1.5 6.8 0 8"/>
          </svg>
          <h2 class="section-title">Ads</h2>
        </div>
        <label class="row">
          <span>
            <span class="row-label">Hide ads</span>
            <span class="row-hint">Sponsored slots, display &amp; companion ads, brand shelves, Premium upsells, and in-player ad chrome (cosmetic - can&rsquo;t skip pre-rolls). Premium accounts won&rsquo;t see ads.</span>
          </span>
          <span class="toggle"><input type="checkbox" data-key="ads.hideAll" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
      </section>

      <!-- Popups -->
      <section class="section">
        <div class="section-header">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M15 9l4 4M19 9l-4 4"/>
          </svg>
          <h2 class="section-title">Popups</h2>
        </div>
        <label class="row">
          <span>
            <span class="row-label">Hide survey popups</span>
            <span class="row-hint">&ldquo;Which Premium features are you aware of?&rdquo; and similar feedback prompts.</span>
          </span>
          <span class="toggle"><input type="checkbox" data-key="popups.hideSurveys" /><span class="toggle-track"><span class="toggle-thumb"></span></span></span>
        </label>
      </section>

      <!-- Appearance - controls the popup itself, not YouTube, so it
           stays active even when the master toggle is off. -->
      <section class="section section-popup">
        <div class="section-header">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3 A9 9 0 0 1 12 21 Z" fill="currentColor"/>
          </svg>
          <h2 class="section-title">Appearance</h2>
        </div>
        <div class="select-row">
          <span class="row-label">Theme</span>
          <div class="segmented" role="group" aria-label="Theme" data-segmented-key="appearance.theme">
            <button type="button" class="segment" data-value="auto">Auto</button>
            <button type="button" class="segment" data-value="light">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M5.6 18.4l1.1-1.1M17.3 6.7l1.1-1.1"/>
              </svg>
              Light
            </button>
            <button type="button" class="segment" data-value="dark">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
              </svg>
              Dark
            </button>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span class="footer-mark" aria-hidden="true">
          <svg viewBox="1.5 6.5 21 11" xmlns="http://www.w3.org/2000/svg" fill="none">
            <rect x="3" y="8" width="18" height="8" rx="4" stroke="currentColor" stroke-width="3"/>
          </svg>
        </span>
        <span class="footer-version" id="version"></span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
